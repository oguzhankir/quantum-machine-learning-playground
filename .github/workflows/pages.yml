name: Verify and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Verify runnable Python projects
        run: |
          python3 -m pip install -r examples/requirements.txt
          python3 examples/verify_examples.py
      - name: Execute and verify the intuition notebooks
        run: |
          python3 -m pip install -r notebooks/requirements.txt
          python3 scripts/execute-notebooks.py --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload validated build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_ENABLEMENT_TOKEN != '' }}
      - name: Explain Pages setup failure
        if: ${{ failure() && steps.pages.outcome == 'failure' }}
        env:
          PAGES_SETTINGS_URL: ${{ github.server_url }}/${{ github.repository }}/settings/pages
        run: |
          echo "::error::Pages configuration failed. Open ${PAGES_SETTINGS_URL} and select GitHub Actions as the build source."
          {
            echo "### GitHub Pages setup required"
            echo
            echo "Open [repository Pages settings](${PAGES_SETTINGS_URL}) and set **Build and deployment → Source → GitHub Actions**, then re-run this workflow."
            echo
            echo 'For automatic first-time enablement, optionally add a repository secret named `PAGES_ENABLEMENT_TOKEN` with Pages write permission (a GitHub App also needs Administration write). The default `GITHUB_TOKEN` can deploy an enabled site but cannot enable Pages.'
            echo
            echo 'Keep repository visibility and existing environment protections unchanged. Check the Configure Pages logs for any additional permission or eligibility errors.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
